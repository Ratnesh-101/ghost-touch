name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default token can write to the repository; CI only needs to read it (A6-09).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        # P1 generator flake fixed (2026-11-03): screen-space separation filter prevents
        # two points from colliding on the same pixel. Retry workaround removed.
        # See docs/kiro-evidence/pbt-p1-flake.md for full history.
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (Python 3.11)
    # ubuntu-latest is 26.04 and has no Python 3.11 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install pytest hypothesis ruff

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run backend tests
        run: pytest

  schema-drift:
    name: Schema Drift
    # ubuntu-latest is 26.04 and has no Python 3.11 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Export schema from backend
        working-directory: backend
        run: python -m app.export_schema

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend types
        working-directory: frontend
        run: npm run gen:types

      - name: Check for schema drift
        run: git diff --exit-code frontend/src/types/scene.gen.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
