name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        # Known flake: hitTest.prop.test.ts (P1, Kiro-owned) fails in roughly 1 run in 5
        # because its generator can put two points on the same pixel (a generator bug, not a
        # hitTest bug): docs/kiro-evidence/pbt-p1-flake.md. Until Kiro fixes the generator we
        # rerun the suite ONCE; a real regression fails both runs, so nothing is hidden.
        # Remove the retry when the P1 generator is fixed.
        run: npm test || (echo "::warning::npm test failed once; retrying (known P1 flake)" && npm test)

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run backend tests
        run: pytest
