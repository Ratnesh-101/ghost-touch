name: Property Tests Soak (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of repetitions for test suites'
        required: false
        default: '10'
      hypothesis_profile:
        description: 'Hypothesis profile name (if configured in pytest)'
        required: false
        default: 'soak'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ITERS: ${{ github.event.inputs.iterations || '10' }}
  HYPOTHESIS_PROFILE: ${{ github.event.inputs.hypothesis_profile || 'soak' }}

jobs:
  frontend-pbt-soak:
    name: Frontend PBT Soak (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      FC_RUNS_MULT: '10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run property test suite repeatedly
        run: |
          export FC_RUNS_MULT=10
          case "$ITERS" in
            '' | *[!0-9]*)
              echo "Error: ITERS must contain digits only, got '$ITERS'" >&2
              exit 1
              ;;
            *)
              ;;
          esac
          echo "Starting frontend soak test with $ITERS iterations (FC_RUNS_MULT=$FC_RUNS_MULT)..."
          for i in $(seq 1 "$ITERS"); do
            echo "--- Frontend Soak Iteration $i / $ITERS ---"
            npm test
          done

  backend-pbt-soak:
    name: Backend PBT Soak (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests with Hypothesis soak
        run: |
          case "$ITERS" in
            '' | *[!0-9]*)
              echo "Error: ITERS must contain digits only, got '$ITERS'" >&2
              exit 1
              ;;
            *)
              ;;
          esac
          HYPOTHESIS_PROFILE="${HYPOTHESIS_PROFILE:-soak}"
          echo "Starting backend soak test with $ITERS iterations using profile '$HYPOTHESIS_PROFILE'..."
          for i in $(seq 1 "$ITERS"); do
            echo "--- Backend Soak Iteration $i / $ITERS ---"
            if [ -n "$HYPOTHESIS_PROFILE" ]; then
              pytest --hypothesis-profile="$HYPOTHESIS_PROFILE"
            else
              pytest
            fi
          done
