name: Accessibility Audit (A11y)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y:
    name: Lighthouse / Axe A11y Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend production bundle
        run: npm run build
        working-directory: frontend

      - name: Run Lighthouse CI accessibility audit
        id: lhci
        continue-on-error: true
        run: |
          npx --yes @lhci/cli@0.14.x collect --staticDistDir=frontend/dist --settings.chromeFlags="--no-sandbox --headless"

      - name: Upload accessibility report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
