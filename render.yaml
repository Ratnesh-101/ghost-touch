# Render Blueprint configuration for Ghost Touch backend
# See docs/DEPLOY.md for step-by-step deployment instructions.
services:
  - type: web
    name: ghost-touch-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Render's documented environment variable for pinning Python version
      - key: PYTHON_VERSION
        value: 3.11.10
      # Secrets entered in Render dashboard (not committed in git)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      # Non-secret service configuration with defaults
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # off | minimal | low | medium | high | default. "off" (thinking_budget=0) is rejected by
      # some models; the backend retries without it, but "minimal" avoids the wasted call.
      - key: GEMINI_THINKING
        value: minimal
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: NEBIUS_MODEL
        value: openbmb/MiniCPM-V-4_5
      # Text-only (Ask answers). Cannot read images, so it must not be used for NEBIUS_MODEL.
      - key: NEBIUS_TEXT_MODEL
        value: nvidia/Nemotron-3-Ultra-550b-a55b
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      # Order of fallback: OpenAI first, then Gemini, then Nebius (last). Providers without a key are skipped.
      - key: VISION_PROVIDERS
        value: openai,gemini,nebius
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "12.0"
      # Number of immediate retries on a transient provider error (429, 503) before falling through
      - key: PROVIDER_RETRIES
        value: "1"
      # Backoff delay in seconds before retrying the same provider on a transient error
      - key: PROVIDER_RETRY_BACKOFF_SECONDS
        value: "0.8"
      - key: SCENE_TIMEOUT_SECONDS
        value: "25.0"
      - key: ASK_TIMEOUT_SECONDS
        value: "10.0"
      - key: SCENE_CACHE_SIZE
        value: "64"
      - key: SCENE_CACHE_TTL_SECONDS
        value: "21600"
      - key: RATE_LIMIT_ASK_PER_MIN
        value: "40"
      - key: RATE_LIMIT_SCENE_PER_MIN
        value: "20"
      - key: RATE_LIMIT_VALIDATE_PER_MIN
        value: "40"
      - key: SCENE_MAX_CONCURRENCY
        value: "2"
      - key: SCENE_QUEUE_WAIT_SECONDS
        value: "6.0"
      - key: ENVIRONMENT
        value: production
      # Replace this with the deployed Vercel frontend URL (no trailing slash)
      - key: ALLOWED_ORIGINS
        value: https://ghost-touch-iota.vercel.app
