[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-touch-backend"
version = "0.1.0"
description = "Ghost Touch backend — vision LLM pipeline and Raw Mode for tactile diagrams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ratnesh Singh" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "google-genai>=1.0.0",
  "opencv-python-headless>=4.10.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "hypothesis>=6.115.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- ruff (lint + format, per tech.md) ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
