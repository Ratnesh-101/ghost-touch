<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Ghost Touch — Feel diagrams you can't see</title>

  <defs>
    <!-- Faint Blueprint Grid -->
    <pattern id="og-blueprint" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#39ff88" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <!-- Ambient Lab Glow -->
    <radialGradient id="og-ambient" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#122a1b" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#0b0e0c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070908" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Deep Charcoal Background & Grid -->
  <rect width="1200" height="630" fill="#0b0e0c" />
  <rect width="1200" height="630" fill="url(#og-ambient)" />
  <rect width="1200" height="630" fill="url(#og-blueprint)" />

  <!-- Specimen Table Frame with Sutures & Copper Rivets -->
  <rect x="40" y="36" width="1120" height="558" rx="20" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-opacity="0.25" />
  <rect x="48" y="44" width="1104" height="542" rx="16" fill="none" stroke="#e8dfc8" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.35" />

  <!-- Corner Copper Rivets -->
  <g fill="#c9803a" stroke="#9a5a1f" stroke-width="1">
    <circle cx="64" cy="60" r="5" /><circle cx="1136" cy="60" r="5" />
    <circle cx="64" cy="570" r="5" /><circle cx="1136" cy="570" r="5" />
  </g>

  <!-- Centered Logo Group -->
  <g transform="translate(360, 75)">
    <!-- Creature Mark -->
    <g transform="translate(0, 0) scale(1.1)">
      <!-- Neck Bolt -->
      <rect x="20" y="44" width="8" height="12" rx="2" fill="#c9803a" stroke="#9a5a1f" stroke-width="1.5" />
      <rect x="16" y="42" width="5" height="16" rx="2" fill="#d9904a" stroke="#9a5a1f" stroke-width="1.5" />
      <line x1="18.5" y1="46" x2="18.5" y2="54" stroke="#783c0c" stroke-width="1.5" stroke-linecap="round" />

      <!-- Phone Chassis -->
      <rect x="28" y="16" width="46" height="68" rx="10" fill="#0b0e0c" stroke="#39ff88" stroke-width="3" />
      <line x1="47" y1="20" x2="55" y2="20" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

      <!-- Screen & Diagram -->
      <rect x="34" y="24" width="34" height="46" rx="5" fill="#070a08" stroke="#39ff88" stroke-opacity="0.35" stroke-width="1.5" />
      <polygon points="51,32 40,58 62,58" fill="#39ff88" fill-opacity="0.15" stroke="#39ff88" stroke-width="2.5" stroke-linejoin="round" />
      <circle cx="51" cy="32" r="2.5" fill="#39ff88" />
      <circle cx="40" cy="58" r="2.5" fill="#39ff88" />
      <circle cx="62" cy="58" r="2.5" fill="#39ff88" />

      <!-- Sutures -->
      <path d="M58 16 L74 32" stroke="#e8dfc8" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.9" />
      <line x1="60" y1="16" x2="63" y2="21" stroke="#e8dfc8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="65" y1="21" x2="68" y2="26" stroke="#e8dfc8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="70" y1="26" x2="73" y2="31" stroke="#e8dfc8" stroke-width="1.5" stroke-linecap="round" />

      <path d="M28 72 L40 84" stroke="#e8dfc8" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.9" />
      <line x1="30" y1="73" x2="33" y2="78" stroke="#e8dfc8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="35" y1="78" x2="38" y2="83" stroke="#e8dfc8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Arcs -->
      <path d="M79 38 A 14 14 0 0 1 79 62" stroke="#39ff88" stroke-width="2.5" stroke-linecap="round" />
      <path d="M85 32 A 22 22 0 0 1 85 68" stroke="#39ff88" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <path d="M91 26 A 30 30 0 0 1 91 74" stroke="#39ff88" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Wordmark -->
    <text x="120" y="70" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="54" font-weight="700" fill="#f5fff8" letter-spacing="-1">Ghost <tspan fill="#39ff88">Touch</tspan></text>
    <line x1="284" y1="86" x2="440" y2="86" stroke="#e8dfc8" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" />
    <line x1="306" y1="80" x2="312" y2="92" stroke="#e8dfc8" stroke-width="2" stroke-linecap="round" />
    <line x1="346" y1="80" x2="352" y2="92" stroke="#e8dfc8" stroke-width="2" stroke-linecap="round" />
    <line x1="386" y1="80" x2="392" y2="92" stroke="#e8dfc8" stroke-width="2" stroke-linecap="round" />
    <line x1="424" y1="80" x2="430" y2="92" stroke="#e8dfc8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tagline & Context -->
  <text x="600" y="245" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f5fff8" letter-spacing="-0.5">Feel diagrams you can't see</text>
  <text x="600" y="285" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="18" fill="#a8c5b5">Tactile graphics &amp; multimodal exploration for STEM education on Android</text>

  <!-- Stitched Seam Divider -->
  <line x1="260" y1="325" x2="940" y2="325" stroke="#e8dfc8" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.45" />

  <!-- Three Organ Specimen Cards (Frankenstein Pitch) -->
  <!-- Organ 1: Nerves (Vibration) -->
  <g transform="translate(130, 365)">
    <rect width="280" height="175" rx="12" fill="#14141e" stroke="#39ff88" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="28" cy="30" r="14" fill="#00e5ff" fill-opacity="0.15" />
    <path d="M22 30 H34 M25 24 H31 M25 36 H31" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="36" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="20" font-weight="700" fill="#00e5ff">NERVES</text>
    <text x="24" y="66" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5fff8">Tactile Buzzer</text>
    <text x="24" y="94" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">Real-time vibration pulses</text>
    <text x="24" y="118" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">trace lines, corners, and axes</text>
    <text x="24" y="142" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">under the student's finger.</text>
  </g>

  <!-- Organ 2: Eyes (Vision AI) -->
  <g transform="translate(460, 365)">
    <rect width="280" height="175" rx="12" fill="#14141e" stroke="#39ff88" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="28" cy="30" r="14" fill="#39ff88" fill-opacity="0.15" />
    <circle cx="28" cy="30" r="5" fill="#39ff88" />
    <text x="50" y="36" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="20" font-weight="700" fill="#39ff88">EYES</text>
    <text x="24" y="66" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5fff8">Vision AI Pipeline</text>
    <text x="24" y="94" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">Converts textbook photos</text>
    <text x="24" y="118" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">into normalized geometric</text>
    <text x="24" y="142" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">scenes and tactile vectors.</text>
  </g>

  <!-- Organ 3: Voice (Theremin & Speech) -->
  <g transform="translate(790, 365)">
    <rect width="280" height="175" rx="12" fill="#14141e" stroke="#39ff88" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="28" cy="30" r="14" fill="#c9803a" fill-opacity="0.2" />
    <path d="M28 20 V40 M24 24 Q28 20 32 24" stroke="#c9803a" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="36" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="20" font-weight="700" fill="#c9803a">VOICE</text>
    <text x="24" y="66" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5fff8">Theremin &amp; Speech</text>
    <text x="24" y="94" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">Pitch tracks vertical height;</text>
    <text x="24" y="118" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">multilingual speech answers</text>
    <text x="24" y="142" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" fill="#a8c5b5">questions in EN, HI, and GU.</text>
  </g>
</svg>
