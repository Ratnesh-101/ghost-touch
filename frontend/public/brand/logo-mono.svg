<svg width="340" height="80" viewBox="0 0 340 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Ghost Touch Logo (Monochrome)</title>

  <!-- Creature Phone Mark (Monochrome #0b0e0c) -->
  <g transform="translate(2, 4) scale(0.72)">
    <!-- Neck Bolt -->
    <rect x="20" y="44" width="8" height="12" rx="2" fill="#0b0e0c" />
    <rect x="16" y="42" width="5" height="16" rx="2" fill="#0b0e0c" />

    <!-- Phone Chassis Body -->
    <rect x="28" y="16" width="46" height="68" rx="10" stroke="#0b0e0c" stroke-width="3" fill="none" />
    <line x1="47" y1="20" x2="55" y2="20" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />

    <!-- Screen Bezel -->
    <rect x="34" y="24" width="34" height="46" rx="5" stroke="#0b0e0c" stroke-width="1.5" fill="none" />

    <!-- Diagram Triangle -->
    <polygon points="51,32 40,58 62,58" stroke="#0b0e0c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none" />
    <circle cx="51" cy="32" r="2.5" fill="#0b0e0c" />
    <circle cx="40" cy="58" r="2.5" fill="#0b0e0c" />
    <circle cx="62" cy="58" r="2.5" fill="#0b0e0c" />

    <!-- Stitched Seams -->
    <path d="M58 16 L74 32" stroke="#0b0e0c" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="60" y1="16" x2="63" y2="21" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
    <line x1="65" y1="21" x2="68" y2="26" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
    <line x1="70" y1="26" x2="73" y2="31" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />

    <path d="M28 72 L40 84" stroke="#0b0e0c" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="30" y1="73" x2="33" y2="78" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
    <line x1="35" y1="78" x2="38" y2="83" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />

    <!-- Vibration Arcs -->
    <path d="M79 38 A 14 14 0 0 1 79 62" stroke="#0b0e0c" stroke-width="2.5" stroke-linecap="round" />
    <path d="M85 32 A 22 22 0 0 1 85 68" stroke="#0b0e0c" stroke-width="2" stroke-linecap="round" />
    <path d="M91 26 A 30 30 0 0 1 91 74" stroke="#0b0e0c" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <text x="82" y="48" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="34" font-weight="700" fill="#0b0e0c" letter-spacing="-0.5">Ghost Touch</text>

  <!-- Thin Suture Line under "Touch" -->
  <line x1="184" y1="58" x2="282" y2="58" stroke="#0b0e0c" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" />
  <line x1="198" y1="54" x2="202" y2="62" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="222" y1="54" x2="226" y2="62" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="246" y1="54" x2="250" y2="62" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="270" y1="54" x2="274" y2="62" stroke="#0b0e0c" stroke-width="1.5" stroke-linecap="round" />
</svg>
